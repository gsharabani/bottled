<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DrinkDrop</title>
  <meta name="description" content="Alcohol delivery made easy - drinks delivered to your door." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div dir="rtl" class="min-h-screen bg-neutral-50 text-neutral-900">
    <div id="toaster" aria-live="polite"></div>

    <header class="sticky top-0 z-20 border-b border-neutral-200 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-5xl flex-col items-center justify-center gap-4 px-4 py-4 sm:px-6" style="min-height:220px">
        <img src="assets/logo.svg" alt="Bottled" class="h-12 w-auto sm:h-14" />
        <nav id="nav" class="flex w-full flex-wrap items-center justify-center gap-2"></nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-10">
      <form id="order-form" class="space-y-12" novalidate>
        <section id="wine" class="scroll-mt-[240px]"></section>
        <div id="categories" class="contents"></div>

        <section class="space-y-6">
          <div>
            <label class="font-medium mb-2 block text-sm" for="notes">בקשות מיוחדות</label>
            <textarea
              class="flex min-h-[60px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-base shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring md:text-sm"
              id="notes" rows="3" placeholder="הערות, העדפות, מועד אספקה וכו'"></textarea>
          </div>

          <div class="rounded-xl border border-neutral-200 bg-white p-6">
            <h2 class="mb-4 text-lg font-medium">פרטי המזמין</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <label class="font-medium mb-2 block text-sm" for="name">שם מלא</label>
                <input id="name" required
                  class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring md:text-sm" />
              </div>
              <div>
                <label class="font-medium mb-2 block text-sm" for="phone">טלפון</label>
                <input id="phone" type="tel" required
                  class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring md:text-sm" />
              </div>
              <div class="sm:col-span-2">
                <label class="font-medium mb-3 block text-sm">נקודת חלוקה</label>
                <div id="pickup" role="radiogroup" dir="ltr" class="grid gap-3 sm:grid-cols-2"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="sticky bottom-4 z-10">
          <div class="rounded-xl border border-neutral-200 bg-white p-5 shadow-sm">
            <div class="mb-3 flex items-center justify-between text-sm">
              <span id="summary" class="text-neutral-500">לא נבחרו פריטים</span>
            </div>
            <button type="submit"
              class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring bg-primary text-primary-foreground shadow hover:bg-primary/90 h-10 rounded-md px-8 w-full gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg>
              שליחת ההזמנה בוואטסאפ
            </button>
          </div>
        </section>
      </form>
    </main>
  </div>

  <div id="handoff" class="handoff" hidden>
    <div class="handoff-card" role="dialog" aria-modal="true" aria-labelledby="handoff-title">
      <h2 id="handoff-title" class="mb-2 text-lg font-medium">עוד צעד אחד: שליחה בוואטסאפ</h2>
      <p class="mb-5 text-sm text-neutral-500">הכנו עבורך הודעה מוכנה בוואטסאפ. ההזמנה נשלחת רק אחרי שלוחצים על "שלח" שם.</p>
      <a id="handoff-link" href="#" target="_blank" rel="noopener"
        class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium bg-primary text-primary-foreground shadow hover:bg-primary/90 h-10 rounded-md px-8 w-full">פתיחת וואטסאפ</a>
      <p class="mt-3 text-center text-xs text-neutral-500">וואטסאפ לא נפתח? לחצו על הכפתור למעלה.</p>
      <button type="button" data-close-handoff class="mt-4 h-9 w-full rounded-md text-sm text-neutral-500 hover:text-neutral-900">חזרה להזמנה</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
